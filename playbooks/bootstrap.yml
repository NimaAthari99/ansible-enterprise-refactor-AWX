---
- name: Migrate `SSH` Safely
  hosts: "{{ target_hosts | default('managed_linux') }}"
  gather_facts: true
  become: true
  serial: 1
  any_errors_fatal: true
  roles:
    - role: nima.platform.ssh_bootstrap
      tags: [bootstrap, ssh]

- name: Bootstrap Privileged Access
  hosts: "{{ target_hosts | default('managed_linux') }}"
  gather_facts: false
  become: false
  serial: 1
  roles:
    - role: nima.platform.privileged_access
      tags: [bootstrap, access]
