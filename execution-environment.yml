---
version: 3

images:
  base_image:
    name: registry.fedoraproject.org/fedora:42

dependencies:
  python_interpreter:
    package_system: python3
  ansible_core:
    package_pip: ansible-core==2.20.8
  ansible_runner:
    package_pip: ansible-runner==2.4.3
  galaxy: collections/requirements.yml
  python: requirements-ee.txt
  system: bindep.txt

options:
  package_manager_path: /usr/bin/dnf
