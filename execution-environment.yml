---
version: 3

build_arg_defaults:
  # All collection artifacts are vendored before the image build. This prevents
  # the Galaxy stage from contacting public distribution servers during build.
  ANSIBLE_GALAXY_CLI_COLLECTION_OPTS: "--offline"

images:
  base_image:
    name: registry.fedoraproject.org/fedora:42

additional_build_files:
  - src: collections/vendor
    dest: vendor

dependencies:
  python_interpreter:
    package_system: python3
  ansible_core:
    package_pip: ansible-core==2.20.8
  ansible_runner:
    package_pip: ansible-runner==2.4.3
  galaxy: collections/requirements-ee-offline.yml
  python: requirements-ee.txt
  system: bindep.txt

options:
  package_manager_path: /usr/bin/dnf
