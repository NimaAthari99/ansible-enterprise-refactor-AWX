---

- name: Delete `Apt Proxy` Config If Exist
  ansible.builtin.file:
    state: absent
    path: /etc/apt/apt.conf.d/01proxy
  when: apt_proxy == true
  tags: apt_proxy-config

- name: Set `Nima Apt Proxy`
  ansible.builtin.template:
    src: apt-proxy.j2
    dest: /etc/apt/apt.conf.d/01proxy
    mode: '0644'
    owner: root
    group: root
  when: apt_proxy == true
  tags: apt_proxy-config

...
