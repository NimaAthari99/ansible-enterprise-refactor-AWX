---

- name: Set Debian Audit Grub Cmdline
  become: true
  ansible.builtin.lineinfile:
    line: 'GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX {{ linux_baseline_grub_audit_cmdline }} {{ linux_baseline_grub_audit_backlog_cmdline }}"'
    dest: /etc/default/grub.d/99-hardening-audit.cfg
    state: present
    create: true
    mode: 0755
    owner: root
    group: root
  tags:
    - auditd-config
    - grub

- name: Set Audit `action_mail_acct`
  become: true
  ansible.builtin.lineinfile:
    regexp: "^action_mail_acct ="
    line: "action_mail_acct = {{ linux_baseline_auditd_action_mail_acct }}"
    dest: /etc/audit/auditd.conf
    mode: 0640
    state: present
    create: 'no'
  tags: auditd-config

- name: Set Audit `admin_space_left_action`
  become: true
  ansible.builtin.lineinfile:
    regexp: "^admin_space_left_action = "
    line: "admin_space_left_action = {{ linux_baseline_auditd_admin_space_left_action }}"
    dest: /etc/audit/auditd.conf
    mode: 0640
    state: present
    create: 'no'
  tags: auditd-config

