- name: Audit Rules
  become: true
  ansible.builtin.template:
    src: hardening.rules.j2
    dest: /etc/audit/rules.d/hardening.rules
    backup: true
    mode: 0600
    owner: root
    group: root
  when: linux_baseline_auditd_apply_audit_rules | bool
  tags: auditd-config
  notify:
    - Generate auditd rules
    - Restart auditd

...
