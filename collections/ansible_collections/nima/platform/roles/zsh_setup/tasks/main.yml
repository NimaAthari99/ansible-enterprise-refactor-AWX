---
- name: Validate supported platform
  ansible.builtin.assert:
    that:
      - ansible_system == 'Linux'
      - ansible_os_family in ['Debian', 'Ubuntu', 'RedHat']
    fail_msg: "zsh_setup currently supports Debian/Ubuntu and RedHat-family Linux."
  when: zsh_setup_enabled | bool

- name: Install Zsh dependencies on Debian family
  ansible.builtin.apt:
    name:
      - zsh
      - git
      - curl
    state: present
    force_apt_get: true
    update_cache: true
  when:
    - zsh_setup_enabled | bool
    - ansible_os_family == 'Debian'
  tags:
    - install_zsh
    - config_zsh

- name: Install Zsh dependencies on RedHat family
  ansible.builtin.dnf:
    name:
      - zsh
      - git
      - curl
    state: present
  when:
    - zsh_setup_enabled | bool
    - ansible_os_family == 'RedHat'

- name: Read passwd database
  ansible.builtin.getent:
    database: passwd
  when: zsh_setup_enabled | bool

- name: Configure Zsh for target users
  ansible.builtin.include_tasks: configure_user.yml
  loop: "{{ zsh_setup_users }}"
  loop_control:
    loop_var: zsh_target_user
  when: zsh_setup_enabled | bool