---
zsh_setup_enabled: true
zsh_setup_users:
  - root
  - nima
zsh_setup_theme: ys
zsh_setup_set_default_shell: true
zsh_setup_install_oh_my_zsh: true
zsh_setup_oh_my_zsh_repo: https://github.com/ohmyzsh/ohmyzsh.git
zsh_setup_oh_my_zsh_version: master
zsh_setup_plugins:
  - git
  - docker
  - zsh-autosuggestions
  - zsh-interactive-cd
zsh_setup_custom_plugins:
  zsh-autosuggestions: https://github.com/zsh-users/zsh-autosuggestions.git
  zsh-interactive-cd: https://github.com/changyuheng/zsh-interactive-cd.git
zsh_setup_syntax_highlighting: true
zsh_setup_syntax_highlighting_repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
zsh_setup_aliases:
  check_net: "ping -c 20 8.8.8.8"
  check_dns: "ping google.com"
  gac: "git add ."
  gcni: "git commit -m"
