---
- name: Change ansible port variable 
  set_fact:
    ansible_port: 22
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-change_ansible_port

- name: Reset SSH connection
  meta: reset_connection
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-reset_connection

- name: Test new connection
  ping:
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-test_connection

- name: Ensure user SSH directory exists
  ansible.builtin.file:
    path: "$HOME/.ssh"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config

- name: Validate authorized keys source configuration
  ansible.builtin.assert:
    that:
      - ssh_bootstrap_authorized_keys_url | length > 0
    fail_msg: >-
      ssh_bootstrap_authorized_keys_url must be set when authorized_keys management is enabled.
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config

- name: Download authorized keys for remote users from `https://main.nima.local`
  ansible.builtin.get_url:
    url: "{{ ssh_bootstrap_authorized_keys_url }}"
    dest: "$HOME/.ssh/authorized_keys"
    owner: root
    group: root
    mode: "0600"
    url_username: "{{ ssh_bootstrap_authorized_keys_url_username if ssh_bootstrap_authorized_keys_url_username | length > 0 else omit }}"
    url_password: "{{ ssh_bootstrap_authorized_keys_url_password if ssh_bootstrap_authorized_keys_url_password | length > 0 else omit }}"
    force: true
    validate_certs: "{{ ssh_bootstrap_authorized_keys_validate_certs }}"
    timeout: 30
  register: ssh_bootstrap_keys_download
  until: ssh_bootstrap_keys_download is succeeded
  retries: 3
  delay: 5
  no_log: false
  when: ssh_bootstrap_manage_authorized_keys | bool
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config
    - add_authorized_keys

- name: Add `authorized_keys` To Remote User
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: "$HOME/.ssh/authorized_keys"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: ssh_bootstrap_add_authorized_keys_file | bool

  notify: Restart SSH service
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config

- name: Copy SSH banner
  ansible.builtin.copy:
    src: ssh_banner
    dest: /etc/issue
    owner: root
    group: root
    mode: "0644"
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config

- name: Gather only required facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "distribution"
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config

- name: Create SSH socket override directory on Ubuntu
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.socket.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_distribution == "Ubuntu"
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config

- name: Configure SSH socket port on Ubuntu
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssh.socket.d/override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Socket]
      ListenStream=
      ListenStream={{ ansible_host }}:{{ ssh_bootstrap_port }}
  register: ssh_bootstrap_socket_override
  when: ansible_distribution == "Ubuntu"
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config

- name: Reload systemd configuration after SSH socket change
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - ansible_distribution == "Ubuntu"
    - ssh_bootstrap_socket_override is changed
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config

- name: Check whether UFW exists
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: ssh_bootstrap_ufw_binary
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config

- name: Open new SSH port in UFW
  community.general.ufw:
    rule: allow
    port: "{{ ssh_bootstrap_port }}"
    proto: tcp
  when: ssh_bootstrap_ufw_binary.stat.exists
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config

- name: Open new SSH port in iptables
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ ssh_bootstrap_port }}"
    jump: ACCEPT
    comment: Ansible SSH migration
  when: not ssh_bootstrap_ufw_binary.stat.exists
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config

- name: Deploy SSH daemon configuration
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH service
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config

- name: Flush SSH service handler
  ansible.builtin.meta: flush_handlers
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config

- name: Restart SSH socket on Ubuntu
  ansible.builtin.systemd_service:
    name: ssh.socket
    state: restarted
    enabled: true
  when:
    - ansible_distribution == "Ubuntu"
    - ssh_bootstrap_socket_override is changed
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config

- name: Verify SSH key exists
  stat:
    path: /root/.ssh/authorized_keys
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config

- name: Wait for the new SSH port from the controller
  ansible.builtin.wait_for:
    host: "{{ ansible_host | default(inventory_hostname) }}"
    port: "{{ ssh_bootstrap_port }}"
    timeout: 60
    state: started
  delegate_to: localhost
  become: false
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config

- name: Switch connection to the new SSH port
  ansible.builtin.set_fact:
    ansible_port: "{{ ssh_bootstrap_port }}"
  tags:
    - ssh_bootstrap
    - ssh_bootstrap-config
