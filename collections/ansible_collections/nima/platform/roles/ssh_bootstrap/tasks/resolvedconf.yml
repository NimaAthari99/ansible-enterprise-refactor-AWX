---

- name: Gather minimal OS facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "min"
    filter:
      - "ansible_distribution"
      - "ansible_distribution_major_version"
      - "ansible_os_family"
  tags:
    - always
    - ssh_bootstrap
    - resolvedconf

- name: Configure `resolved.conf` File
  become: true
  ansible.builtin.template:
    src: resolved.conf.j2
    dest: /etc/systemd/resolved.conf
    backup: 'yes'
    mode: 0644
    owner: root
    group: root
  when: ansible_facts["distribution"] == "Ubuntu"
  notify:
    - Restart systemd-resolved
  tags:
    - resolved-config

- name: Configure `resolv.conf` File
  become: true
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    backup: 'yes'
    mode: 0644
    owner: root
    group: root
  tags:
    - resolved-config

...
