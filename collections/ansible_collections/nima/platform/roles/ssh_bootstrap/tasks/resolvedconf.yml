---

- name: Configure `resolved.conf` File
  become: true
  ansible.builtin.template:
    src: resolved.conf.j2
    dest: /etc/systemd/resolved.conf
    backup: 'yes'
    mode: 0644
    owner: root
    group: root
  notify:
    - Restart systemd-resolved
  tags:
    - resolved-config

- name: Configure `resolv.conf` File
  become: true
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    backup: 'yes'
    mode: 0644
    owner: root
    group: root
  tags:
    - resolved-config

...
