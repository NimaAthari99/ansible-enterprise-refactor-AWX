---
argument_specs:
  main:
    short_description: Migrate and harden SSH access with validation before reconnecting.
    options:
      ssh_bootstrap_port:
        type: int
        default: 8090
      ssh_bootstrap_manage_user_authorized_keys:
        type: bool
        default: false
      ssh_bootstrap_manage_root_authorized_keys:
        type: bool
        default: false
      ssh_bootstrap_authorized_keys_url:
        type: str
        default: ""
      ssh_bootstrap_authorized_keys_url_username:
        type: str
        default: ""
      ssh_bootstrap_authorized_keys_url_password:
        type: str
        default: ""
        no_log: true
      ssh_bootstrap_authorized_keys_validate_certs:
        type: bool
        default: true
      ssh_bootstrap_sshd_config:
        type: dict
        default: {}
