---
- name: Validate Docker role platform
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: "nima.platform.docker_engine currently supports Debian-family systems only."

- name: Install Docker prerequisites
  ansible.builtin.import_tasks: dependencies.yml
  tags: [docker, docker_dependencies]

- name: Install Docker Engine
  ansible.builtin.import_tasks: install.yml
  tags: [docker, docker_install]

- name: Configure Docker Engine
  ansible.builtin.import_tasks: configure.yml
  tags: [docker, docker_config]
