---
# Copy this file OUTSIDE the Git checkout, chmod 600, fill it, and optionally
# encrypt it with ansible-vault. Never commit the real secret values.

awx_machine_credential_inputs:
  username: "CHANGE_ME"
  ssh_key_data: |
    CHANGE_ME
  ssh_key_unlock: ""
  password: ""
  become_method: sudo
  become_username: root
  become_password: ""

awx_platform_secrets_inputs:
  secret_platform_http_proxy: ""
  secret_file_service_username: ""
  secret_file_service_password: ""
  secret_loki_password: ""
  secret_nginx_auth_password: ""

# Used only when awx_scm_credential.manage=true in awx/controller.yml.
awx_scm_credential_inputs:
  username: ""
  password: ""
  ssh_key_data: ""
  ssh_key_unlock: ""

# Used by the AWX Controller Reconcile Job Template. The current AWX devel API
# exposes Basic Auth but does not expose /api/v2/tokens/, so self-management
# uses a dedicated AWX service account username/password instead of OAuth PAT.
awx_controller_api_credential_inputs:
  controller_host: "https://awx.nima.local:8043"
  controller_username: "CHANGE_ME"
  controller_password: "CHANGE_ME"
  controller_verify_ssl: "false"
